{% extends "layout.html" %}

{% block content %}
<div class="row justify-content-center pt-md-3">
    <div class="col-md-6 col-lg-5 col-xl-4">
        <div class="card shadow-sm border-0 mt-3 p-2">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-emerald-subtle p-3 mb-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-person-plus-fill text-emerald" viewBox="0 0 16 16">
                            <path d="M1 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/>
                            <path fill-rule="evenodd" d="M13.5 5a.5.5 0 0 1 .5.5V7h1.5a.5.5 0 0 1 0 1H14v1.5a.5.5 0 0 1-1 0V8h-1.5a.5.5 0 0 1 0-1H13V5.5a.5.5 0 0 1 .5-.5"/>
                        </svg>
                    </div>
                    <h3 class="fw-bold mb-1">Create Account</h3>
                    <p class="text-muted small">Join ClassConnect today</p>
                </div>

                <form action="/register" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input autocomplete="off" autofocus class="form-control" id="username" name="username" placeholder="Choose a username" type="text" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input class="form-control" id="password" name="password" placeholder="Create a password" type="password" required>
                    </div>
                    <div class="mb-3">
                        <label for="confirmation" class="form-label">Confirm Password</label>
                        <input class="form-control" id="confirmation" name="confirmation" placeholder="Confirm your password" type="password" required>
                    </div>
                    <div class="mb-4">
                        <label for="role" class="form-label">I am a:</label>
                        <select class="form-select" id="role" name="role" required>
                            <option value="" disabled selected>Select Role</option>
                            <option value="student">Student</option>
                            <option value="teacher">Teacher</option>
                        </select>
                    </div>
                    <button class="btn btn-primary w-100 py-2 shadow-sm" type="submit">Register</button>
                </form>

                <div class="mt-4 text-center">
                    <small class="text-muted">Already have an account? <a href="/login" class="fw-semibold text-emerald text-decoration-none">Log In</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
