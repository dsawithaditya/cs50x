{% extends "layout.html" %}

{% block content %}
<div class="row justify-content-center pt-md-4">
    <div class="col-md-6 col-lg-5 col-xl-4">
        <div class="card shadow-sm border-0 mt-3 p-2">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-emerald-subtle p-3 mb-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="bi bi-key-fill text-emerald" viewBox="0 0 16 16">
                            <path d="M3.5 11.5a3.5 3.5 0 1 1 3.163-5H14L15.5 8 14 9.5l-1-1-1 1-1-1-1 1-1.5-1.5H6.663a3.5 3.5 0 0 1-3.163 2M2.5 9a1 1 0 1 0 0-2 1 1 0 0 0 0 2"/>
                        </svg>
                    </div>
                    <h3 class="fw-bold mb-1">Reset Password</h3>
                    <p class="text-muted small">Enter your account details to set a new password</p>
                </div>

                <form action="/forgot_password" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-semibold">Username <span class="text-danger">*</span></label>
                        <input autocomplete="off" autofocus class="form-control rounded-3" id="username" name="username" placeholder="Enter your username" type="text" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-semibold">Account Role <span class="text-danger">*</span></label>
                        <div class="d-flex gap-2">
                            <div class="form-check flex-fill p-2.5 border rounded-3 bg-light-subtle d-flex align-items-center gap-2">
                                <input class="form-check-input ms-1" type="radio" name="role" id="roleStudent" value="student" checked>
                                <label class="form-check-label fw-semibold text-body cursor-pointer" for="roleStudent">
                                    Student
                                </label>
                            </div>
                            <div class="form-check flex-fill p-2.5 border rounded-3 bg-light-subtle d-flex align-items-center gap-2">
                                <input class="form-check-input ms-1" type="radio" name="role" id="roleTeacher" value="teacher">
                                <label class="form-check-label fw-semibold text-body cursor-pointer" for="roleTeacher">
                                    Teacher
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="new_password" class="form-label fw-semibold">New Password <span class="text-danger">*</span></label>
                        <input class="form-control rounded-3" id="new_password" name="new_password" placeholder="Create a new password" type="password" required>
                    </div>

                    <div class="mb-4">
                        <label for="confirmation" class="form-label fw-semibold">Confirm New Password <span class="text-danger">*</span></label>
                        <input class="form-control rounded-3" id="confirmation" name="confirmation" placeholder="Re-type new password" type="password" required>
                    </div>

                    <button class="btn btn-capsule-emerald w-100 py-2.5 shadow-sm fw-semibold" type="submit">
                        Reset Password
                    </button>
                </form>

                <div class="mt-4 text-center">
                    <small class="text-muted">Remembered your password? <a href="/login" class="fw-semibold text-emerald text-decoration-none">Log In</a></small>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
